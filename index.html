<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Bio-Agri Mitra — Real Scanner</title>
<meta name="theme-color" content="#0C831F">
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --green:#0C831F;
    --green-lt:#E8F5E9;
    --yellow:#F8CB46;
    --yellow-dk:#E8B92E;
    --blue:#1F80F0;
    --red:#E23744;
    --text:#1C1C1C;
    --muted:#7E808C;
    --border:#E8E9EB;
  }
  *{ font-family:'Inter', system-ui, sans-serif; -webkit-tap-highlight-color:transparent; box-sizing:border-box; }
  html,body{ margin:0; padding:0; height:100%; background:#F2F3F5; overflow:hidden; }
  body{ display:flex; align-items:center; justify-content:center; }

  .phone{
    width:390px; max-width:100vw;
    height:844px; max-height:100vh;
    background:#000;
    border-radius:44px;
    padding:10px;
    box-shadow:0 30px 60px -20px rgba(0,0,0,.35);
    position:relative;
  }
  .phone-screen{
    width:100%; height:100%;
    background:#fff;
    border-radius:36px;
    overflow:hidden;
    position:relative;
    display:flex; flex-direction:column;
  }

  .statusbar{
    height:32px; flex:none;
    display:flex; align-items:center; justify-content:space-between;
    padding:0 24px;
    background:#fff;
    font-size:12px; font-weight:600; color:var(--text);
  }

  .topbar{
    height:56px; flex:none;
    display:flex; align-items:center; justify-content:space-between;
    padding:0 16px;
    border-bottom:1px solid var(--border);
    background:#fff;
  }
  .logo-mark{
    width:40px; height:40px;
    border-radius:12px;
    background:linear-gradient(145deg,#0FA628,var(--green));
    color:#fff; font-size:20px;
    display:flex; align-items:center; justify-content:center;
    box-shadow:0 4px 12px -4px rgba(12,131,31,.5);
  }
  .tb-btn{
    width:40px; height:40px;
    border-radius:12px;
    background:#F2F3F5;
    border:none;
    display:flex; align-items:center; justify-content:center;
    font-size:16px; color:var(--text);
    cursor:pointer;
  }
  .tb-btn.play{ background:var(--green); color:#fff; }

  .content{
    flex:1; overflow-y:auto;
    padding-bottom:96px;
    -ms-overflow-style:none; scrollbar-width:none;
  }
  .content::-webkit-scrollbar{ display:none; }
  .screen{ display:none; }
  .screen.active{ display:block; }

  /* HOME */
  .voice-hero{
    padding:32px 20px 24px;
    background:linear-gradient(180deg,#FFFFFF,#F8FBF8);
    text-align:center;
  }
  .voice-status{
    height:32px;
    display:flex; align-items:center; justify-content:center;
    margin-bottom:8px;
  }
  .voice-status-icon{
    font-size:22px;
    color:var(--green);
    opacity:0;
    transition:opacity .3s;
  }
  .voice-status-icon.show{ opacity:1; animation:pulse 1.4s ease-in-out infinite; }
  @keyframes pulse{ 50%{ transform:scale(1.15); } }

  .mic-wrap{
    position:relative;
    width:200px; height:200px;
    margin:0 auto;
    display:flex; align-items:center; justify-content:center;
  }
  .mic-ring{
    position:absolute; inset:0;
    border-radius:9999px;
    border:2px solid var(--green);
    opacity:.5;
    animation:pulse-ring 2.4s ease-out infinite;
  }
  .mic-ring.r2{ animation-delay:.8s; }
  .mic-ring.r3{ animation-delay:1.6s; }
  @keyframes pulse-ring{
    0%{ transform:scale(.75); opacity:.5; }
    100%{ transform:scale(1.4); opacity:0; }
  }
  .mic-btn{
    width:150px; height:150px;
    border-radius:9999px;
    background:radial-gradient(circle at 32% 28%,#0FA628,var(--green) 75%);
    color:#fff;
    font-size:64px;
    display:flex; align-items:center; justify-content:center;
    border:none;
    box-shadow:0 20px 40px -12px rgba(12,131,31,.55), inset 0 -8px 16px rgba(0,0,0,.15);
    position:relative; z-index:2;
    cursor:pointer;
  }
  .mic-btn.listening{ animation:beat 1s ease-in-out infinite; }
  @keyframes beat{ 50%{ transform:scale(1.05); } }

  .wave{
    display:flex; align-items:center; justify-content:center;
    gap:4px; height:32px;
    margin-top:12px;
  }
  .wave span{
    width:4px; height:6px;
    border-radius:2px;
    background:var(--green);
    opacity:.4;
    transition:.15s;
  }
  .wave.active span{ animation:eq .9s ease-in-out infinite; opacity:1; }
  .wave.active span:nth-child(2){ animation-delay:.1s; }
  .wave.active span:nth-child(3){ animation-delay:.2s; }
  .wave.active span:nth-child(4){ animation-delay:.3s; }
  .wave.active span:nth-child(5){ animation-delay:.4s; }
  .wave.active span:nth-child(6){ animation-delay:.5s; }
  .wave.active span:nth-child(7){ animation-delay:.6s; }
  @keyframes eq{ 0%,100%{ height:6px; } 50%{ height:28px; } }

  .transcript{
    margin:20px auto 0;
    max-width:300px;
    background:#F2F3F5;
    border-radius:14px;
    padding:12px 16px;
    display:none;
    text-align:left;
  }
  .transcript p{
    font-size:14px; font-weight:600; color:var(--text);
    margin:0; line-height:1.4;
  }

  .action-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
    padding:24px 20px;
  }
  .action{
    border-radius:20px;
    padding:24px 16px;
    display:flex; flex-direction:column;
    align-items:center; gap:14px;
    cursor:pointer;
    border:none;
  }
  .action:active{ transform:scale(.96); }
  .action.scan{
    background:linear-gradient(145deg,#F8CB46,#E8B92E);
    box-shadow:0 12px 24px -8px rgba(232,185,46,.5);
  }
  .action.speak{
    background:linear-gradient(145deg,#0FA628,var(--green));
    box-shadow:0 12px 24px -8px rgba(12,131,31,.5);
  }
  .action-icon{
    width:72px; height:72px;
    border-radius:22px;
    background:rgba(255,255,255,.28);
    display:flex; align-items:center; justify-content:center;
    font-size:36px; color:#fff;
  }
  .action-label{
    font-size:12px; font-weight:800; color:#fff;
    letter-spacing:.02em;
  }

  /* CAMERA MODAL */
  .camera-modal{
    position:absolute; inset:0;
    background:#000;
    z-index:200;
    display:none;
    flex-direction:column;
  }
  .camera-modal.show{ display:flex; }
  .camera-header{
    height:64px;
    display:flex; align-items:center; justify-content:space-between;
    padding:0 16px;
    color:#fff;
  }
  .cam-close{
    width:44px; height:44px;
    border-radius:9999px;
    background:rgba(255,255,255,.15);
    border:none;
    color:#fff;
    font-size:18px;
    cursor:pointer;
  }
  .cam-title{
    font-size:14px; font-weight:700;
  }
  .cam-hint{
    display:flex; flex-direction:column; align-items:center;
    gap:6px;
    color:rgba(255,255,255,.9);
    font-size:11px;
    font-weight:600;
  }
  .cam-stage{
    flex:1;
    position:relative;
    overflow:hidden;
    display:flex; align-items:center; justify-content:center;
    background:#000;
  }
  .cam-video{
    width:100%; height:100%;
    object-fit:cover;
  }
  /* Focus reticle (guide frame for leaf) */
  .cam-frame{
    position:absolute;
    top:50%; left:50%;
    transform:translate(-50%,-50%);
    width:75%; aspect-ratio:1/1;
    border:2px solid rgba(255,255,255,.5);
    border-radius:24px;
    pointer-events:none;
  }
  .cam-frame::before,
  .cam-frame::after,
  .cam-frame .c3,
  .cam-frame .c4{
    content:'';
    position:absolute;
    width:32px; height:32px;
    border-color:#6EE787;
    border-style:solid;
  }
  .cam-frame::before{ top:-2px; left:-2px; border-width:3px 0 0 3px; border-radius:24px 0 0 0; }
  .cam-frame::after{ top:-2px; right:-2px; border-width:3px 3px 0 0; border-radius:0 24px 0 0; }
  .cam-frame .c3{ bottom:-2px; left:-2px; border-width:0 0 3px 3px; border-radius:0 0 0 24px; }
  .cam-frame .c4{ bottom:-2px; right:-2px; border-width:0 3px 3px 0; border-radius:0 0 24px 0; }
  .cam-frame-hint{
    position:absolute;
    bottom:calc(50% - 42% - 42px);
    left:50%; transform:translateX(-50%);
    color:#fff;
    font-size:11px;
    font-weight:700;
    background:rgba(0,0,0,.4);
    padding:6px 12px;
    border-radius:9999px;
    white-space:nowrap;
    backdrop-filter:blur(6px);
  }
  /* Grid overlay */
  .cam-grid{
    position:absolute; inset:0;
    pointer-events:none;
    display:grid;
    grid-template-columns:1fr 1fr 1fr;
    grid-template-rows:1fr 1fr 1fr;
  }
  .cam-grid div{
    border-right:1px solid rgba(255,255,255,.08);
    border-bottom:1px solid rgba(255,255,255,.08);
  }
  .cam-grid div:nth-child(3n){ border-right:none; }
  .cam-grid div:nth-child(n+7){ border-bottom:none; }

  .cam-controls{
    height:180px;
    background:#000;
    display:flex;
    flex-direction:column;
    padding:12px 20px 20px;
    gap:12px;
  }
  .zoom-row{
    display:flex; align-items:center; gap:12px;
    color:#fff;
  }
  .zoom-row i{ font-size:14px; opacity:.8; }
  .zoom-row input[type=range]{
    flex:1;
    -webkit-appearance:none;
    height:4px;
    background:rgba(255,255,255,.2);
    border-radius:2px;
    outline:none;
  }
  .zoom-row input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none;
    width:20px; height:20px;
    background:#fff;
    border-radius:9999px;
    cursor:pointer;
  }
  .zoom-val{
    font-size:11px;
    font-weight:700;
    min-width:32px;
    text-align:right;
  }
  .shutter-row{
    display:flex; align-items:center; justify-content:space-around;
  }
  .shutter-btn{
    width:76px; height:76px;
    border-radius:9999px;
    background:#fff;
    border:5px solid rgba(255,255,255,.35);
    background-clip:content-box;
    padding:6px;
    cursor:pointer;
    position:relative;
  }
  .shutter-btn::after{
    content:'';
    position:absolute; inset:8px;
    border-radius:9999px;
    background:#fff;
  }
  .shutter-btn:active::after{ background:#E0E0E0; }
  .cam-side-btn{
    width:52px; height:52px;
    border-radius:9999px;
    background:rgba(255,255,255,.15);
    border:none;
    color:#fff;
    font-size:20px;
    cursor:pointer;
  }
  .cam-side-btn.on{ background:#F8CB46; color:#000; }

  /* RESULT SCREEN */
  .result-hero{
    margin:16px;
    border-radius:22px;
    aspect-ratio:1/1;
    max-height:280px;
    display:flex; align-items:center; justify-content:center;
    position:relative;
    overflow:hidden;
  }
  .result-hero img{ width:100%; height:100%; object-fit:cover; }
  .result-hero i.ph{ font-size:110px; }

  .result-badge{
    position:absolute;
    top:12px; left:12px;
    background:rgba(255,255,255,.95);
    padding:6px 12px;
    border-radius:8px;
    font-size:10px;
    font-weight:800;
    text-transform:uppercase;
    letter-spacing:.03em;
    display:flex; align-items:center; gap:6px;
    box-shadow:0 2px 6px rgba(0,0,0,.15);
  }
  .result-confidence{
    position:absolute;
    top:12px; right:12px;
    background:rgba(255,255,255,.95);
    padding:6px 12px;
    border-radius:8px;
    font-size:10px;
    font-weight:800;
    display:flex; align-items:center; gap:6px;
    box-shadow:0 2px 6px rgba(0,0,0,.15);
  }

  .sev-row{
    display:flex; align-items:center; justify-content:center;
    gap:6px;
    margin:0 0 20px;
  }
  .sev-dot{
    width:14px; height:14px;
    border-radius:9999px;
    background:#E0E0E0;
    transition:.2s;
  }
  .sev-dot.on{ background:var(--yellow-dk); }
  .sev-dot.on.bad{ background:var(--red); }
  .sev-dot.on.good{ background:var(--green); }

  .reason-chip{
    margin:0 16px 16px;
    padding:14px 16px;
    border-radius:16px;
    display:flex; align-items:flex-start; gap:10px;
    font-size:12px;
    line-height:1.4;
    font-weight:600;
  }

  .remedy-grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:12px;
    padding:0 16px 20px;
  }
  .remedy-tile{
    aspect-ratio:1/1;
    border-radius:20px;
    border:2px solid var(--border);
    background:#fff;
    display:flex; align-items:center; justify-content:center;
    font-size:36px;
    cursor:pointer;
    color:var(--muted);
    position:relative;
    transition:.15s;
  }
  .remedy-tile.active{
    border-color:var(--green);
    background:var(--green-lt);
    color:var(--green);
    box-shadow:0 8px 20px -8px rgba(12,131,31,.4);
  }
  .remedy-tile .num{
    position:absolute;
    top:8px; right:10px;
    font-size:11px;
    font-weight:800;
    color:var(--muted);
    background:#F2F3F5;
    width:20px; height:20px;
    border-radius:9999px;
    display:flex; align-items:center; justify-content:center;
  }
  .remedy-tile.active .num{ background:var(--green); color:#fff; }

  .play-btn{
    margin:0 16px 16px;
    width:calc(100% - 32px);
    padding:20px;
    border-radius:20px;
    border:none;
    background:linear-gradient(135deg,#0FA628,var(--green));
    color:#fff;
    font-size:24px;
    display:flex; align-items:center; justify-content:center;
    gap:10px;
    cursor:pointer;
    box-shadow:0 12px 28px -10px rgba(12,131,31,.55);
  }
  .play-btn.playing{ background:linear-gradient(135deg,#E23744,#B71C1C); }

  .lang-row{
    display:flex; gap:12px;
    padding:0 16px 16px;
  }
  .lang-btn{
    flex:1;
    padding:14px;
    border-radius:16px;
    border:2px solid var(--border);
    background:#fff;
    font-size:22px;
    cursor:pointer;
  }
  .lang-btn.active{
    border-color:var(--green);
    background:var(--green-lt);
  }

  .back-btn{
    width:40px; height:40px;
    border-radius:12px;
    background:#F2F3F5;
    border:none;
    color:var(--text);
    font-size:16px;
    cursor:pointer;
    display:flex; align-items:center; justify-content:center;
  }

  .bottom-nav{
    position:absolute;
    left:0; right:0; bottom:0;
    height:80px;
    background:#fff;
    border-top:1px solid var(--border);
    display:flex;
    align-items:center;
    justify-content:space-around;
    padding:0 12px;
    z-index:40;
  }
  .nav-btn{
    width:60px; height:60px;
    border-radius:20px;
    border:none;
    background:transparent;
    color:var(--muted);
    font-size:24px;
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
  }
  .nav-btn.active{
    background:var(--green-lt);
    color:var(--green);
    transform:translateY(-4px);
    box-shadow:0 8px 20px -8px rgba(12,131,31,.4);
  }

  /* ANALYSIS OVERLAY */
  .analyze-overlay{
    position:absolute; inset:0;
    background:rgba(0,0,0,.92);
    z-index:250;
    display:none;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    padding:40px 24px;
    text-align:center;
  }
  .analyze-overlay.show{ display:flex; }
  .analyze-photo{
    width:220px; height:220px;
    border-radius:20px;
    object-fit:cover;
    box-shadow:0 20px 40px -10px rgba(0,0,0,.8);
    position:relative;
    overflow:hidden;
  }
  .analyze-photo img{ width:100%; height:100%; object-fit:cover; }
  .analyze-photo::after{
    content:'';
    position:absolute;
    left:0; right:0;
    height:3px;
    background:linear-gradient(90deg,transparent,#6EE787,transparent);
    box-shadow:0 0 16px 4px rgba(110,231,135,.9);
    animation:sweep 1.5s ease-in-out infinite;
  }
  @keyframes sweep{
    0%{ top:5%; opacity:.3; }
    50%{ top:92%; opacity:1; }
    100%{ top:5%; opacity:.3; }
  }
  .analyze-step{
    margin-top:24px;
    color:#fff;
    font-size:14px;
    font-weight:700;
    display:flex; align-items:center; gap:10px;
    min-height:28px;
  }
  .analyze-step i{ color:#6EE787; }

  /* TOAST */
  #toast-wrap{
    position:absolute; top:44px; left:0; right:0;
    display:flex; flex-direction:column; align-items:center;
    gap:8px;
    z-index:300;
    pointer-events:none;
  }
  .toast{
    background:#1C1C1C;
    color:#fff;
    padding:10px 18px;
    border-radius:12px;
    font-size:12px;
    font-weight:600;
    display:flex; align-items:center; gap:8px;
    box-shadow:0 8px 20px -6px rgba(0,0,0,.5);
    animation:tin .25s ease, tout .3s ease 2.8s forwards;
    max-width:88%;
  }
  .toast i{ color:#6EE787; }
  @keyframes tin{ from{opacity:0;transform:translateY(-6px);} to{opacity:1;transform:none;} }
  @keyframes tout{ to{opacity:0;transform:translateY(-6px);} }

  /* Loading spinner for text */
  .spinner{
    width:20px; height:20px;
    border:3px solid rgba(255,255,255,.2);
    border-top-color:#fff;
    border-radius:9999px;
    animation:spin .8s linear infinite;
  }
  @keyframes spin{ to{ transform:rotate(360deg); } }
</style>
</head>

<body>
<div class="phone">
  <div class="phone-screen">

    <!-- STATUS BAR -->
    <div class="statusbar">
      <span>9:41</span>
      <span style="display:flex;gap:6px;align-items:center;">
        <i class="fa-solid fa-signal"></i>
        <i class="fa-solid fa-wifi"></i>
        <i class="fa-solid fa-battery-three-quarters"></i>
      </span>
    </div>

    <div id="toast-wrap"></div>

    <!-- TOP BAR -->
    <div class="topbar">
      <div class="logo-mark"><i class="fa-solid fa-seedling"></i></div>
      <div style="display:flex;gap:8px;">
        <button class="tb-btn" id="topLangBtn"><span id="topFlag">🇮🇳</span></button>
        <button class="tb-btn play" id="helpBtn"><i class="fa-solid fa-circle-question"></i></button>
      </div>
    </div>

    <!-- CONTENT -->
    <div class="content">

      <!-- HOME -->
      <section class="screen active" id="screen-home">
        <div class="voice-hero">
          <div class="voice-status">
            <i class="fa-solid fa-ear-listen voice-status-icon" id="listenIcon"></i>
          </div>
          <div class="mic-wrap">
            <div class="mic-ring"></div>
            <div class="mic-ring r2"></div>
            <div class="mic-ring r3"></div>
            <button class="mic-btn" id="micBtn">
              <i class="fa-solid fa-microphone"></i>
            </button>
          </div>
          <div class="wave" id="wave">
            <span></span><span></span><span></span><span></span>
            <span></span><span></span><span></span>
          </div>
          <div class="transcript" id="transcriptCard">
            <p id="transcriptText"></p>
          </div>
        </div>

        <div class="action-grid">
          <button class="action scan" id="scanBtn">
            <div class="action-icon"><i class="fa-solid fa-camera-retro"></i></div>
            <div class="action-label">SCAN</div>
          </button>
          <button class="action speak" id="speakBtn">
            <div class="action-icon"><i class="fa-solid fa-comment-dots"></i></div>
            <div class="action-label">SPEAK</div>
          </button>
        </div>
      </section>

      <!-- RESULT -->
      <section class="screen" id="screen-result">
        <div style="height:56px;display:flex;align-items:center;gap:12px;padding:0 16px;border-bottom:1px solid var(--border);">
          <button class="back-btn" onclick="showScreen('home')">
            <i class="fa-solid fa-arrow-left"></i>
          </button>
          <button class="play-btn" id="replayBtn" style="margin:0;margin-left:auto;width:auto;padding:10px 16px;font-size:14px;">
            <i class="fa-solid fa-volume-high"></i>
          </button>
        </div>

        <div class="result-hero" id="resultHero">
          <img id="resultPhoto" alt="">
          <span class="result-badge" id="resultBadge"></span>
          <span class="result-confidence" id="resultConf"></span>
        </div>

        <div class="sev-row" id="sevRow">
          <div class="sev-dot" data-i="0"></div>
          <div class="sev-dot" data-i="1"></div>
          <div class="sev-dot" data-i="2"></div>
          <div class="sev-dot" data-i="3"></div>
        </div>

        <div class="reason-chip" id="reasonChip"></div>

        <div class="remedy-grid" id="remedyGrid"></div>

        <div class="lang-row">
          <button class="lang-btn active" data-lang="hi" onclick="setLang('hi')">🇮🇳</button>
          <button class="lang-btn" data-lang="en" onclick="setLang('en')">🇬🇧</button>
        </div>

if (SpeechRec){

// Live interim transcript for smooth UX

}

const demoPhrases = [
  'मेरी फसल में कीड़े लग गए हैं',

  'फसल मुरझा रही है'
];

function fallbackListen(){
  setListening(true);
  setTimeout(()=>{
    setListening(false);
    const phrase = demoPhrases[Math.floor(Math.random()*demoPhrases.length)];
    showTranscript(phrase);
    setTimeout(()=>{
      transcriptCard.style.display = 'none';

/* ---------------- SPEECH SYNTHESIS (Improved) ---------------- */
let voicesReady = false;
let cachedVoices = [];

function loadVoices(){
  if (!('speechSynthesis' in window)) return;
  const load = ()=>{
    cachedVoices = window.speechSynthesis.getVoices();
    if (cachedVoices.length) voicesReady = true;
  };
  load();
  window.speechSynthesis.onvoiceschanged = load;
  setTimeout(load, 800);
  setTimeout(load, 2000);
}
loadVoices();

function pickVoice(lang){
  const list = cachedVoices.length ? cachedVoices : window.speechSynthesis.getVoices();
  if (!list.length) return null;
  const want = lang === 'hi' ? 'hi' : 'en';
  // Prefer exact hi-IN, then any hi
  return (
    list.find(v => v.lang && v.lang.toLowerCase() === 'hi-in') ||
    list.find(v => v.lang && v.lang.toLowerCase().startsWith('hi')) ||
    list.find(v => v.lang && v.lang.toLowerCase().startsWith('en-in')) ||
    list.find(v => v.lang && v.lang.toLowerCase().startsWith('en')) ||
    null
  );
}

/* Smart chunking: splits on natural punctuation AND at length limit
   so the voice sounds fluent, never stuttering or dragging. */
function chunkText(text, maxLen=140){
  const sentences = text.split(/(?<=[।.!?])\s+/);
  const chunks = [];
  let cur = '';
  sentences.forEach(s=>{
    if ((cur + ' ' + s).length > maxLen && cur){
      chunks.push(cur.trim());
      cur = s;
    } else {
      cur = cur ? cur + ' ' + s : s;
    }
  });
  if (cur.trim()) chunks.push(cur.trim());
  return chunks;
}

function speakNow(text, lang, onDone){
  if (!('speechSynthesis' in window)){
    if (onDone) onDone();
    return;
  }
  window.speechSynthesis.cancel();
  const voice = pickVoice(lang);
  const chunks = chunkText(text);
  let i = 0;

  const speakChunk = ()=>{
    if (i >= chunks.length){ if (onDone) onDone(); return; }
    const u = new SpeechSynthesisUtterance(chunks[i]);
    if (voice) u.voice = voice;
    u.lang = voice ? voice.lang : (lang === 'hi' ? 'hi-IN' : 'en-IN');
    u.rate = 0.92;       // natural pace (0.9-1.0 is fluent)
    u.pitch = 1.0;
    u.volume = 1.0;
    i++;
    u.onend = speakChunk;
    u.onerror = speakChunk;
    window.speechSynthesis.speak(u);
  };
  speakChunk();
}

async function openCamera(){

        advanced: [{ zoom: 1 }, { focusMode: 'continuous' }]

    cameraStream = await navigator.mediaDevices.getUserMedia(constraints);
    camVideo.srcObject = cameraStream;
    videoTrack = cameraStream.getVideoTracks()[0];

    // Read capabilities
    const caps = videoTrack.getCapabilities ? videoTrack.getCapabilities() : {};
    // Configure zoom slider range
    if (caps.zoom){
      zoomSlider.min = caps.zoom.min || 1;

  const canvas = document.createElement('canvas');
  // Use native camera resolution
  canvas.width = camVideo.videoWidth;
  canvas.height = camVideo.videoHeight;
  const ctx = canvas.getContext('2d');
  ctx.drawImage(camVideo, 0, 0, canvas.width, canvas.height);

  // Crop to the frame area (center square ~75%)
  const side = Math.min(canvas.width, canvas.height) * 0.78;
  const cx = canvas.width / 2 - side / 2;
  const cy = canvas.height / 2 - side / 2;
  const crop = document.createElement('canvas');
  crop.width = crop.height = side;
  crop.getContext('2d').drawImage(canvas, cx, cy, side, side, 0, 0, side, side);

/* ---------------- Core analysis ---------------- */
function runLeafAnalysis(dataUrl){
  return new Promise((resolve)=>{
    const img = new Image();
    img.onload = ()=>{
      try{
        // Sample at good resolution for accuracy
        const W = 200, H = 200;
        const canvas = document.createElement('canvas');
        canvas.width = W; canvas.height = H;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, W, H);
        const data = ctx.getImageData(0, 0, W, H).data;

        let green=0, brown=0, dark=0, pale=0, yellow=0, orange=0, white=0, other=0;
        let red=0, redish=0;
        let bright_px = 0;
        let total = W * H;

        // Also compute local contrast map (for spots/holes)
        const gray = new Float32Array(total);
        for (let i=0, p=0; i<data.length; i+=4, p++){
          const r = data[i], g = data[i+1], b = data[i+2];
          const bright = (r+g+b)/3;
          gray[p] = bright;

          const max = Math.max(r,g,b);
          const min = Math.min(r,g,b);
          const sat = max === 0 ? 0 : (max-min)/max;
          const isGreen = g > r * 1.08 && g > b * 1.08 && g > 60;
          const isBrown = r > 80 && r > g && g > b && (r-b) > 25 && bright < 170;
          const isDark = bright < 60;
          const isPale = bright > 200 && sat < 0.18;
          const isWhite = bright > 220 && sat < 0.10;
          const isYellow = r > 170 && g > 150 && b < 110;
          const isOrange = r > 180 && g > 90 && g < 170 && b < 100 && sat > 0.4;
          const isRed = r > 140 && g < 110 && b < 110 && (r-g) > 40;

          if (isDark){ dark++; }
          else if (isWhite){ white++; pale++; }
          else if (isPale){ pale++; }
          else if (isGreen){ green++; }
          else if (isYellow){ yellow++; }
          else if (isOrange){ orange++; }
          else if (isRed){ red++; }
          else if (isBrown){ brown++; }
          else { other++; }
        }

        // Edge/spot detection: count pixels whose brightness differs
        // sharply from 8 neighbors — these are spots, holes, or edges.
        let spotPixels = 0;
        for (let y=1; y<H-1; y++){
          for (let x=1; x<W-1; x++){
            const i = y*W + x;
            const center = gray[i];
            let diff = 0;
            for (let dy=-1; dy<=1; dy++){
              for (let dx=-1; dx<=1; dx++){
                if (dx===0 && dy===0) continue;
                diff += Math.abs(center - gray[(y+dy)*W + (x+dx)]);
              }
            }
            if (diff / 8 > 55) spotPixels++;
          }
        }

        const props = {
          green: green/total,
          brown: brown/total,
          dark: dark/total,
          pale: pale/total,
          yellow: yellow/total,
          orange: orange/total,
          red: red/total,
          spotRatio: spotPixels/total,
          total
        };

        // Is this a leaf?
        // Requirements: green dominant OR clear spots/browns on a mostly green base
        const isLeaf = (props.green > 0.20) || (props.green > 0.10 && (props.brown + props.yellow + props.orange) > 0.08);

        resolve({ props, isLeaf });
      } catch(e){
        resolve({ isLeaf: false, props: null });
      }
    };
    img.onerror = ()=> resolve({ isLeaf: false, props: null });
    img.src = dataUrl;
  });
}

function matchDisease(props){
  // Score each disease by squared distance of observed to signature midpoint
  let best = null;
  let bestScore = Infinity;
  const observed = {
    green: props.green,
    yellow: props.yellow,
    brown: props.brown,
    dark: props.dark,
    orange: props.orange,
    pale: props.pale,
    spotRatio: props.spotRatio
  };

  diseases.forEach(d=>{
    let dist = 0;
    let weight = 0;
    Object.keys(d.sig).forEach(k=>{
      const [lo, hi] = d.sig[k];
      const val = observed[k] !== undefined ? observed[k] : (k === 'pale' ? props.pale : 0);
      // Distance to range (0 if inside, else distance to nearest end)
      let d1 = 0;
      if (val < lo) d1 = lo - val;
      else if (val > hi) d1 = val - hi;
      // Weight: spotRatio matters a lot for disease detection
      const w = (k === 'spotRatio') ? 3 : 1;
      dist += w * d1 * d1;
      weight += w;
    });
    dist = dist / weight;
    // Bonus for spotting anomalies
    if (d.key !== 'healthy' && props.spotRatio > 0.06) dist *= 0.85;
    if (d.key === 'healthy' && props.spotRatio > 0.10) dist *= 1.6;

    if (dist < bestScore){
      bestScore = dist;
      best = d;
    }
  });
  // Confidence: inverse of distance, capped
  const confidence = Math.max(35, Math.min(96, Math.round(100 - bestScore * 120)));
  return { disease: best, confidence };
}

/* ---------------- RESULT RENDERING ---------------- */
function showResult(result, dataUrl){
  const { disease, confidence } = matchDisease(result.props);
  currentDiagnosis = disease;
  currentRemedyIndex = 0;

  // Photo
  document.getElementById('resultPhoto').src = dataUrl;

  // Badge
  const badge = document.getElementById('resultBadge');
  const isHealthy = disease.severity === 0;
  badge.style.color = disease.color;
  badge.innerHTML = `<i class="fa-solid ${disease.icon}"></i> ${isHealthy ? (currentLang==='hi'?'स्वस्थ':'HEALTHY') : (currentLang==='hi'?'रोगी':'DISEASED')}`;

  // Confidence
  const conf = document.getElementById('resultConf');
  conf.style.color = confidence > 75 ? '#0C831F' : (confidence > 55 ? '#E8B92E' : '#E23744');
  conf.innerHTML = `<i class="fa-solid fa-chart-simple"></i> ${confidence}%`;

  // Severity dots
  const dots = document.querySelectorAll('#sevRow .sev-dot');
  dots.forEach((dot,i)=>{
    dot.classList.remove('on','bad','good');
    if (i < disease.severity){
      dot.classList.add('on');
      if (disease.bad) dot.classList.add('bad');
    } else if (isHealthy && i < 4){
      dot.classList.add('on','good');
    }
  });

  // Reason
  const reason = document.getElementById('reasonChip');
  reason.style.background = isHealthy ? '#E8F5E9' : (disease.bad ? '#FFF4F4' : '#FFF8E1');
  reason.style.color = isHealthy ? '#0C831F' : (disease.bad ? '#8C2E2E' : '#8B6F1F');
  reason.innerHTML = `<i class="fa-solid fa-circle-info" style="font-size:18px;flex:none;margin-top:2px;"></i>
    <span>${currentLang==='hi' ? disease.reasonHi : disease.reasonEn}</span>`;

  renderRemedies();
  showScreen('result');

  // Speak the diagnosis
  const spoken = currentLang === 'hi'
    ? `${isHealthy ? 'आपकी पत्ती स्वस्थ है।' : disease.nameHi + ' पाया गया है।'} ${disease.reasonHi} ${disease.remedies[0].hi}`
    : `${isHealthy ? 'Your leaf is healthy.' : disease.nameEn + ' detected.'} ${disease.reasonEn} ${disease.remedies[0].en}`;
  currentSpeech = { hi: '', en: '' };
  // Build full speech script
  currentSpeech.hi = `${isHealthy ? 'आपकी पत्ती स्वस्थ है।' : disease.nameHi + ' पाया गया है।'} ${disease.reasonHi} अब उपाय बताए जा रहे हैं। ${disease.remedies.map(r=>r.hi).join(' ')}`;
  currentSpeech.en = `${isHealthy ? 'Your leaf is healthy.' : disease.nameEn + ' detected.'} ${disease.reasonEn} Now the remedies. ${disease.remedies.map(r=>r.en).join(' ')}`;

  setTimeout(()=>{
    speakNow(currentLang === 'hi' ? currentSpeech.hi : currentSpeech.en, currentLang);
  }, 400);
}

function renderRemedies(){
  const grid = document.getElementById('remedyGrid');
  grid.innerHTML = '';
  currentDiagnosis.remedies.forEach((r, i)=>{
    const tile = document.createElement('button');
    tile.className = 'remedy-tile' + (i === currentRemedyIndex ? ' active' : '');
    tile.innerHTML = `
      <span class="num">${i+1}</span>
      <i class="fa-solid ${r.icon}"></i>
    `;
    tile.addEventListener('click', ()=>{
      currentRemedyIndex = i;
      document.querySelectorAll('.remedy-tile').forEach((t, idx)=>{
        t.classList.toggle('active', idx === i);
      });
      // Speak just this remedy
      const text = currentLang === 'hi'
        ? 'उपाय ' + (i+1) + '. ' + r.hi
        : 'Remedy ' + (i+1) + '. ' + r.en;
      speakNow(text, currentLang);
    });
    grid.appendChild(tile);
  });
}

/* ---------------- PLAY GUIDANCE ---------------- */
const playBtn = document.getElementById('playBtn');
const playLabel = document.getElementById('playLabel');
let isPlaying = false;

playBtn.addEventListener('click', ()=>{
  if (isPlaying){
    window.speechSynthesis.cancel();
    isPlaying = false;
    playBtn.classList.remove('playing');
    playLabel.textContent = currentLang === 'hi' ? 'ऑडियो गाइड' : 'Play Guidance';
    return;
  }
  if (!currentDiagnosis) return;
  const text = currentDiagnosis.remedies.map((r,i)=> 
    (currentLang==='hi' ? 'उपाय '+(i+1)+'. '+r.hi : 'Remedy '+(i+1)+'. '+r.en)
  ).join(' ');
  isPlaying = true;
  playBtn.classList.add('playing');
  playLabel.textContent = currentLang === 'hi' ? 'रोकें' : 'Stop';
  speakNow(text, currentLang, ()=>{
    isPlaying = false;
    playBtn.classList.remove('playing');
    playLabel.textContent = currentLang === 'hi' ? 'ऑडियो गाइड' : 'Play Guidance';
  });
});

document.getElementById('replayBtn').addEventListener('click', ()=>{
  if (!currentDiagnosis) return;
  speakNow(currentLang === 'hi' ? currentSpeech.hi : currentSpeech.en, currentLang);
});

/* ---------------- LANGUAGE ---------------- */
function setLang(lang){
  currentLang = lang;
  document.querySelectorAll('.lang-btn').forEach(b=>{
    b.classList.toggle('active', b.dataset.lang === lang);
  });
  document.getElementById('topFlag').textContent = lang === 'hi' ? '🇮🇳' : '🇬🇧';
  if (currentDiagnosis){
    showResult({ props: null, isLeaf: true }, document.getElementById('resultPhoto').src);
  }
}

document.getElementById('topLangBtn').addEventListener('click', ()=>{
  setLang(currentLang === 'hi' ? 'en' : 'hi');
});
